<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14161f" />
    <meta
      name="description"
      content="A seasonal-creature card battler. Build a deck and outmaneuver your opponent across 5 lanes — free, no install, play in the browser."
    />

    <!-- Open Graph / Twitter — a shared link should carry its own preview
         card instead of a bare title, since GitHub Pages serves nothing
         like that by default. Absolute URLs are required here (crawlers
         fetch these directly, not resolved against the page). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Season's Battle" />
    <meta property="og:title" content="Season's Battle" />
    <meta
      property="og:description"
      content="A seasonal-creature card battler. Build a deck and outmaneuver your opponent across 5 lanes — free, no install, play in the browser."
    />
    <meta property="og:image" content="https://gaberhopers.github.io/codex-p/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://gaberhopers.github.io/codex-p/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Season's Battle" />
    <meta
      name="twitter:description"
      content="A seasonal-creature card battler. Build a deck and outmaneuver your opponent across 5 lanes."
    />
    <meta name="twitter:image" content="https://gaberhopers.github.io/codex-p/og-image.png" />

    <title>Season's Battle</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
